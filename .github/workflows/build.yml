name: Build Desktop App
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # 깃허브 웹 화면에서 직접 빌드 버튼을 눌러 실행할 수 있게 해줍니다.

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 윈도우 빌드를 위해 adb/scrcpy 실행 바이너리 준비
      - name: Prepare Windows Binaries
        if: matrix.os == 'windows-latest'
        run: |
          mkdir bin
          powershell -File ./Windows_setup.ps1
        shell: bash

      # 맥 빌드를 위해 빈 bin 디렉토리 구조 확보
      - name: Prepare macOS Binaries Directory
        if: matrix.os == 'macos-latest'
        run: mkdir bin

      # 윈도우 환경 빌드
      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      # 맥 환경 빌드 (인증서가 없을 경우 경고 로그는 출력되지만, 미인증 상태의 .dmg가 정상 생성됩니다)
      - name: Build Application (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      # 빌드 완료 후 결과물(.exe, .dmg)을 깃허브에 업로드하여 다운로드 가능하게 만듭니다.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 안드로이드_미러링-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish Windows Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: 안드로이드_미러링-windows-latest
          path: release-assets

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DroidBridge ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
